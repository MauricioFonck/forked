[project]
name = "forked-runtime"
version = "0.1.0.dev0"
description = "Local-first research runtime for controlled counterfactual experiments over instrumented software workflows and AI-agent executions."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "FORKED maintainers" }]
keywords = ["ai-agents", "counterfactual", "replay", "provenance", "evidence", "reproducibility", "observability"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.scripts]
forked = "forked.adapters.inbound.cli.app:main"

[project.urls]
Documentation = "https://github.com/MauricioFonck/forked/tree/main/docs"
Issues = "https://github.com/MauricioFonck/forked/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forked"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "S", "N", "ANN", "TID"]
ignore = ["ANN401", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["forked", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

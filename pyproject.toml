[project]
name = "forked-runtime"
version = "0.1.0a1"
description = "Local-first research runtime for controlled counterfactual experiments over instrumented software workflows and AI-agent executions."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "FORKED maintainers" }]
keywords = ["ai-agents", "counterfactual", "replay", "provenance", "evidence", "reproducibility", "observability"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
# Framework adapters are opt-in: the core never imports them (ADR-013).
pydantic-ai = ["pydantic-ai-slim>=2.71,<3"]
langgraph = ["langgraph>=1.2,<2"]

[project.scripts]
forked = "forked.adapters.inbound.cli.app:main"

[project.urls]
Documentation = "https://github.com/MauricioFonck/forked/tree/main/docs"
Issues = "https://github.com/MauricioFonck/forked/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pydantic-ai-slim>=2.71,<3",
  "langgraph>=1.2,<2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forked"]

[tool.hatch.build.targets.sdist]
# Lean sdist: the source, its tests and the published schemas; not the engineering memory or images.
include = ["src", "tests", "spec", "examples", "benchmarks", "LICENSE", "README.md", "CHANGELOG.md", "CITATION.cff", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# langsmith (a transitive dependency of LangChain) ships a pytest plugin we do not use; on Python 3.14
# it raises a DeprecationWarning at import time, which `filterwarnings = error` turns into a crash.
addopts = "-ra --strict-markers -p no:langsmith_plugin"
pythonpath = ["."]
filterwarnings = [
  "error",
  # Third-party, optional (LangChain -> langsmith) and only on Python 3.14: scoped by message AND origin.
  "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:langsmith",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "S", "N", "ANN", "TID"]
ignore = ["ANN401", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["forked", "tests", "examples", "benchmarks"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**" = ["E501"]
"src/forked/adapters/inbound/cli/html_report.py" = ["E501"]  # HTML templates  # report prose and tables; the core keeps the 100-column limit
"tests/**" = ["S101", "ANN", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples", "benchmarks"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (unit, contract, security, integration, acceptance, guardians)
        run: uv run pytest
      - name: Demo smoke test (offline)
        shell: bash
        run: |
          export FORKED_STORE="$RUNNER_TEMP/forked-store"
          uv run forked record toy-agent
          RUN_ID=$(uv run forked runs | awk '{print $1}')
          uv run forked inspect "$RUN_ID" --strict --json
          uv run forked replay "$RUN_ID"
          test "$(ls "$FORKED_STORE/toy-outbox" | wc -l)" -eq 1  # replay sent nothing

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (unit, contract, security, integration, acceptance, guardians)
        run: uv run pytest
      - name: Demo smoke test (offline)
        shell: bash
        run: |
          export FORKED_STORE="$RUNNER_TEMP/forked-store"
          uv run forked record toy-agent
          RUN_ID=$(uv run forked runs | awk '{print $1}')
          uv run forked inspect "$RUN_ID" --strict --json
          uv run forked replay "$RUN_ID"
          uv run forked branch "$RUN_ID" --at 3 --value 0.5 | tee branch.txt
          grep -q "claim      controlled_comparison" branch.txt
          BRANCH_ID=$(head -1 branch.txt | awk '{print $NF}')
          uv run forked export "$RUN_ID" "$BRANCH_ID" --out "$RUNNER_TEMP/evidence"
          uv run forked verify "$RUNNER_TEMP/evidence"
          rm -rf "$FORKED_STORE/runs" && uv run forked verify "$RUNNER_TEMP/evidence"  # needs only the package
          test "$(ls "$FORKED_STORE/toy-outbox" | wc -l)" -eq 1  # replay and branch sent nothing
          uv run forked otel-export "$RUN_ID" --include-payloads --out "$RUNNER_TEMP/trace.json"
          uv run forked otel-import "$RUNNER_TEMP/trace.json"
      - name: Pydantic AI example and FCRB benchmark (offline)
        shell: bash
        run: |
          export PYDANTIC_AI_NO_BANNER=1
          uv run python -m examples.pydantic_ai_expense_agent
          uv run python -m benchmarks.fcrb --out "$RUNNER_TEMP/fcrb"
          grep -q "S10" "$RUNNER_TEMP/fcrb/REPORT.md"

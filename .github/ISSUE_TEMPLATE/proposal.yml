name: Proposal / feature
description: Propose a capability, adapter, protocol change or benchmark scenario.
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and context
      description: Who needs this and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable outcomes — including failure and unsafe cases.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [capture, replay, branches, effects/safety, comparison, evidence, CIP protocol, adapters, benchmark, docs]
    validations:
      required: true
  - type: textarea
    id: claims
    attributes:
      label: Guarantees and limitations
      description: What will this guarantee, and what will it explicitly not guarantee?

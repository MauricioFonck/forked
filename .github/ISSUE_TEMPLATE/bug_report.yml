name: Bug report
description: FORKED did something wrong (wrong report, lost event, leaked data, crash).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Do not open a public issue — follow SECURITY.md.
        Never paste real secrets, prompts with personal data or production traces.
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction (commands, synthetic data)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `forked --version`, Python version and OS
    validations:
      required: true
